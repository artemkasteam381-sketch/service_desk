<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Линия поддержки и похожие обращения</title>
<style>body{font:16px/1.5 system-ui;background:#f4f6fb;color:#19263b;max-width:1000px;margin:32px auto;padding:0 20px}section,article{background:white;border:1px solid #dce3ef;border-radius:12px;padding:20px;margin:16px 0}textarea,select,button{font:inherit;padding:10px;box-sizing:border-box}textarea{width:100%;min-height:150px}select{display:block;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{background:#254b85;color:white;border:0;border-radius:7px;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}.text{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#607087}#error{color:#a02222}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<h1>Линия поддержки и похожие обращения</h1><p class="muted">Обработка выполняется локально на этом компьютере.</p>
<section><label for="text">Сообщение клиента</label><textarea id="text" placeholder="Введите сообщение клиента"></textarea><p class="muted">Неизвестные поля оставьте пустыми.</p><div class="grid" id="metadata"></div><button id="run" disabled>Найти</button><p id="status" role="status">Загрузка…</p><p id="error" role="alert"></p></section>
<section id="output" hidden><h2>Рекомендуемая линия</h2><h3 id="line"></h3><div id="notes"></div></section><div id="hits"></div>
<script>
const $=id=>document.getElementById(id),fields=new Map();
fetch('/api/options').then(r=>{if(!r.ok)throw Error('Сервис недоступен');return r.json()}).then(options=>{for(const [name,values] of Object.entries(options)){const label=document.createElement('label'),select=document.createElement('select');label.textContent=name;select.add(new Option('Не указано',''));for(const value of values)select.add(new Option(value,value));label.append(select);$('metadata').append(label);fields.set(name,select)}$('run').disabled=false;$('status').textContent='Готово.'}).catch(e=>{$('error').textContent=e.message});
$('run').onclick=async()=>{if(!$('text').value.trim()){$('error').textContent='Введите сообщение.';return}$('error').textContent='';$('output').hidden=true;$('hits').replaceChildren();$('run').disabled=true;$('status').textContent='Обрабатываю…';try{const response=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('text').value,metadata:Object.fromEntries([...fields].map(([k,v])=>[k,v.value]))})});const data=await response.json();if(!response.ok)throw Error(data.error);$('line').textContent=data.recommended_line||'Недостаточно текста';$('notes').replaceChildren();for(const note of data.notes){const p=document.createElement('p');p.textContent=note;$('notes').append(p)}$('output').hidden=false;const heading=document.createElement('h2');heading.textContent='Похожие обращения';$('hits').append(heading);if(!data.analogs.length){const p=document.createElement('p');p.textContent='Нет результатов.';$('hits').append(p)}for(const hit of data.analogs){const card=document.createElement('article'),title=document.createElement('h3'),text=document.createElement('div'),result=document.createElement('p');title.textContent=`№ ${hit.id} · решено: ${hit.line}`;text.className='text';text.textContent=hit.text;result.textContent='Результат из истории: '+(hit.result||'не указан');card.append(title,text,result);$('hits').append(card)}$('status').textContent='Готово.'}catch(e){$('error').textContent=e.message;$('status').textContent='Не удалось обработать запрос.'}finally{$('run').disabled=false}};
</script></html>
